name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!mobile/**"
      - "!docs/**"
      - "docs/api-v1.md"
      - "docs/asset-register.md"
  workflow_dispatch: {}

permissions:
  contents: read

# Main shares one group (serialised; an in-progress main run is never cancelled; a newer
# main push replaces one that is still pending); other refs get their own so a
# branch dry-run can never cancel a pending main deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'production-deploy' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # prisma.config.ts requires DATABASE_URL to be set just to load the config
    # (prisma generate/validate don't actually connect to it) — unreachable dummy (port 1), never a real DB.
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:1/ci"
    # Real Postgres for npm test (ADR-0011 harness needs PG 13+ for DROP DATABASE ... WITH (FORCE)).
    # Throwaway CI-only credentials; the service container dies with the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-pw
          POSTGRES_DB: fullcharge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npx tsx scripts/test-status-mapping.ts
      # Older DB tests (snapshotCapture, syncLock) use the base test DB directly, so migrate it first.
      # DATABASE_URL is overridden for this step only; the harness makes its own per-process DBs.
      - name: Migrate base test DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:ci-only-pw@localhost:5432/fullcharge_test
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-pw@localhost:5432/fullcharge_test
      - run: npm run build

  deploy:
    name: Deploy to VM
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, full-charge-vm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash deploy/deploy.sh
